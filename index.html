<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atomic Journey — Interactive Periodic Table</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="top-zone">
    <section class="bohr-panel">
      <div class="subshell-panel" id="subshell-panel"></div>
      <svg id="bohr-svg" viewBox="0 0 440 440" aria-label="Bohr model diagram">
        <defs>
          <radialGradient id="protonGradient" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ffe0da"/>
            <stop offset="40%" stop-color="#ff4630"/>
            <stop offset="100%" stop-color="#7a0f05"/>
          </radialGradient>
          <radialGradient id="neutronGradient" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="45%" stop-color="#e7ebef"/>
            <stop offset="100%" stop-color="#7b8794"/>
          </radialGradient>
          <radialGradient id="electronGradient" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#e6f6ff"/>
            <stop offset="40%" stop-color="#1f9bff"/>
            <stop offset="100%" stop-color="#083866"/>
          </radialGradient>
          <radialGradient id="blobGradient" cx="35%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ffdcd6"/>
            <stop offset="45%" stop-color="#c1544a"/>
            <stop offset="100%" stop-color="#4d160f"/>
          </radialGradient>
        </defs>
      </svg>
      <div class="legend-chips">
        <button class="legend-chip" data-kind="proton"><span class="dot proton"></span>Proton</button>
        <button class="legend-chip" data-kind="neutron"><span class="dot neutron"></span>Neutron</button>
        <button class="legend-chip" data-kind="electron"><span class="dot electron"></span>Electron</button>
        <button class="legend-chip" data-kind="shell"><span class="dot shell"></span>Shell</button>
        <button class="legend-chip nucleus-mode-chip active" id="nucleus-mode-btn" aria-label="Toggle 3D/2D nucleus view">🌐 3D nucleus</button>
      </div>
    </section>

    <aside class="info-panel" id="info-panel">
      <button class="flip-btn" id="flip-btn" aria-label="Show element write-up">i</button>
      <div class="info-card-inner" id="info-card-inner">
        <div class="info-card-front" id="info-card-front"></div>
        <div class="info-card-back" id="info-card-back"></div>
      </div>
    </aside>
  </header>

  <main class="bottom-zone">
    <div class="table-toolbar">
      <label class="tm-toggle">
        <input type="checkbox" id="tm-toggle">
        Show transition metals
      </label>
      <div class="category-legend">
        <span><i style="background:#f5d7a3"></i>Alkali</span>
        <span><i style="background:#f2a53e"></i>Alkaline-earth</span>
        <span><i style="background:#c9c6ea"></i>Transition</span>
        <span><i style="background:#f7c6ce"></i>Other metal</span>
        <span><i style="background:#e8b98f"></i>Metalloid</span>
        <span><i style="background:#f08767"></i>Nonmetal</span>
        <span><i style="background:#8fbc8f"></i>Halogen</span>
        <span><i style="background:#ffffff;border:1px solid #1e3a8a"></i>Noble gas</span>
        <span><i style="background:#d9db84"></i>Lanthanide</span>
        <span><i style="background:#a8d5e8"></i>Actinide</span>
      </div>
    </div>

    <div class="table-wrap">
      <div class="periodic-grid" id="periodic-grid"></div>

      <div class="heatmap-toggles">
        <button class="heatmap-btn" id="expand-table-btn">⤢ Expand table</button>
        <button class="heatmap-btn" id="heat-reactivity-btn">🔥 Reactivity</button>
        <button class="heatmap-btn" id="heat-electroneg-btn">⚡ Electronegativity</button>
      </div>

      <div class="dpad" id="dpad">
        <button data-dir="up" aria-label="Move up a group">&#8593;</button>
        <button data-dir="left" aria-label="Move left across a period">&#8592;</button>
        <div class="dpad-center" id="dpad-current">Si</div>
        <button data-dir="right" aria-label="Move right across a period">&#8594;</button>
        <button data-dir="down" aria-label="Move down a group">&#8595;</button>
      </div>
    </div>
  </main>

</div>

<div id="popup" class="popup hidden"></div>

<a id="notes-btn" class="corner-btn notes-btn" href="notes.html" aria-label="Open notes page">Notes</a>
<button id="tour-btn" class="corner-btn tour-btn" aria-label="Take the tour">?</button>

<div id="tour-blocker" class="tour-blocker hidden"></div>
<div id="tour-highlight" class="tour-highlight hidden"></div>
<div id="tour-caption" class="tour-caption hidden">
  <div class="tour-title" id="tour-title"></div>
  <div class="tour-body" id="tour-body"></div>
  <div class="tour-controls">
    <button id="tour-skip">Skip</button>
    <span class="tour-progress" id="tour-progress"></span>
    <button id="tour-next">Next</button>
  </div>
</div>

<script src="elements.js"></script>
<script src="app.js"></script>
</body>
</html>
